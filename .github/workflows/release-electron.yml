name: Build & Release Electron App (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-electron:
    name: Build Electron Windows App
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Package Electron Executable (.exe)
        run: npx electron-builder --win nsis portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlasticBan-Electron-Windows
          path: release-electron/*.exe

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-electron/*.exe
          name: "نسخه ویندوز الکترون (Electron) - ${{ github.ref_name }}"
          body: |
            ### 📦 دانلود سیستم حسابداری پلاستیک‌بان - نسخه الکترون (Electron)
            
            - **سازگاری**: فوق‌العاده بالا با انواع ویندوز (Windows 10, 11)
            - **شامل**: 
              - فایل نصب‌کننده خودکار (NSIS Installer)
              - نسخه پرتابل (بدون نیاز به نصب)
